# Hält den Render-Free-Dienst wach, damit der Ausfall-Alarm (watchdog.js) auch dann läuft, wenn der Bot keine Daten mehr schickt.
# GitHub-Cron ist "best effort" (oft 5–20 Min. verspätet) – Hauptweg ist cron-job.org (jede Minute/5 Min.), das hier ist die Reserve.
name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /healthz
        run: |
          for i in 1 2 3; do
            curl -fsS -m 60 https://cloude-trading.onrender.com/healthz && exit 0
            sleep 20
          done
          exit 1
